# 主应用入口 nginx：托管 SPA 静态资源 + 反向代理后端各服务（全站同源）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 优先使用 vite 构建时预压缩的 .gz 文件
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全头（X-Frame-Options 必须 SAMEORIGIN：micro-app iframe 沙箱需要同源嵌入）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # 音乐微应用（同源代理到子应用容器）
    location /app-a/ {
        proxy_pass http://subapp:80/;
        proxy_set_header Host $host;
    }

    # Java 后端 API（SSE 流式响应需关闭缓冲）
    location /api/ {
        proxy_pass http://java-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 上传的图片等静态文件（Spring 静态映射 /uploads/**）
    location /uploads/ {
        proxy_pass http://java-backend:3001;
        proxy_set_header Host $host;
    }

    # Socket.IO WebSocket（netty-socketio 端口 3002）
    location /socket.io/ {
        proxy_pass http://java-backend:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
