<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 内容安全策略：限制资源加载来源，防范 XSS 与数据外泄。
       注意 frame-ancestors / sandbox / report-uri 三个 CSP 指令无法通过 <meta> 生效，
       必须由 HTTP 响应头注入；X-Frame-Options: SAMEORIGIN 由 vite.config.ts 的 server.headers 注入，
       允许同源 iframe 嵌入（micro-app 沙箱需要），等价于 frame-ancestors 'self' -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:5175; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com http://localhost:5175; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:3001 http://localhost:5175 https:; connect-src 'self' http://localhost:3001 http://localhost:3002 http://localhost:8000 http://localhost:5175 ws://localhost:3002 ws://localhost:5175; media-src 'self' http://localhost:3001 http://localhost:5175 blob:; frame-src 'self' http://localhost:5175; base-uri 'self' http://localhost:5175; form-action 'self'">

  <!-- 防止 MIME 嗅探；referrer 策略。点击劫持由 X-Frame-Options 响应头防御 -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">

  <!-- 基础 SEO -->
  <title>个人博客</title>
  <meta name="description" content="个人博客站点，提供技术文章、音乐播放器、AI 助手、树洞互动等内容，记录生活与技术的点滴。">
  <meta name="keywords" content="博客,技术文章,音乐播放器,AI 助手,树洞,个人主页">
  <meta name="author" content="blog">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://example.com/">

  <!-- Open Graph 社交分享 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="个人博客">
  <meta property="og:title" content="个人博客">
  <meta property="og:description" content="个人博客站点，提供技术文章、音乐播放器、AI 助手、树洞互动等内容。">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/og-image.png">
  <meta property="og:locale" content="zh_CN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="个人博客">
  <meta name="twitter:description" content="个人博客站点，提供技术文章、音乐播放器、AI 助手、树洞互动等内容。">
  <meta name="twitter:image" content="https://example.com/og-image.png">

  <!-- 图标 -->
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">

  <!-- 后端接口与字体预连接，加速首屏 -->
  <link rel="preconnect" href="http://localhost:3001" crossorigin>
  <link rel="dns-prefetch" href="http://localhost:3001">

  <!-- Inter 字体：非阻塞加载，避免 CSS 阻塞渲染 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- 结构化数据 JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "个人博客",
    "url": "https://example.com/",
    "description": "个人博客站点，提供技术文章、音乐播放器、AI 助手、树洞互动等内容。",
    "inLanguage": "zh-CN"
  }
  </script>

  <!-- 首屏渲染优化：占位骨架，避免 SPA 白屏 -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #app { min-height: 100vh; }
    #initial-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="initial-loader">加载中...</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
